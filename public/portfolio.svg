<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)" />
    </pattern>
    
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="90%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask">
      <rect x="-500" y="-500" width="2280" height="1720" fill="url(#fade)" />
    </mask>

    <filter id="glow-j" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <rect x="-500" y="-500" width="2280" height="1720" fill="#050505" />
  
  <rect x="-500" y="-500" width="2280" height="1720" fill="url(#grid)" mask="url(#grid-mask)" />

  <circle cx="640" cy="360" r="200" fill="rgba(255, 255, 255, 0.04)" filter="url(#ambient-glow)" />

  <path d="M 640 360 C 500 360, 350 280, 350 200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6, 6" />
  <path d="M 640 360 C 500 360, 350 440, 350 520" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6, 6" />
  <path d="M 640 360 C 780 360, 930 280, 930 200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6, 6" />
  <path d="M 640 360 C 780 360, 930 440, 930 520" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6, 6" />

  <g transform="translate(350, 200)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0a0a0a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="0" y="5" fill="#e5e5e5" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600" letter-spacing="2">TAILWIND</text>
  </g>
  <g transform="translate(350, 520)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0a0a0a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="0" y="5" fill="#e5e5e5" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600" letter-spacing="2">ASTRO 5</text>
  </g>
  <g transform="translate(930, 200)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0a0a0a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="0" y="5" fill="#e5e5e5" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600" letter-spacing="2">JAVASCRIPT</text>
  </g>
  <g transform="translate(930, 520)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0a0a0a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="0" y="5" fill="#e5e5e5" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600" letter-spacing="2">PERFORMANCE</text>
  </g>

  <circle cx="640" cy="360" r="105" fill="#050505" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <circle cx="640" cy="360" r="90" fill="#0a0a0a" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <path 
    d="M 585.8 300 C 626.6 290.4, 672.2 288, 715.4 295.2 C 722.6 296.4, 725 304.8, 717.8 308.4 C 677 302.4, 633.8 304.8, 595.4 313.2 C 588.2 314.4, 583.4 303.6, 585.8 300 Z M 638.6 300 C 655.4 343.2, 653 396, 621.8 424.8 C 600.2 444, 569 436.8, 559.4 415.2 C 554.6 403.2, 561.8 393.6, 571.4 400.8 C 581 410.4, 600.2 412.8, 614.6 398.4 C 633.8 379.2, 636.2 333.6, 629 314.4 C 626.6 304.8, 636.2 295.2, 638.6 300 Z" 
    fill="#ffffff"
    filter="url(#glow-j)"
  />
</svg>
